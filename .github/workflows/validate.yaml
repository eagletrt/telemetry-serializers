name: Validate protos

# Checks the .proto definitions only: nothing is published. Each project
# generates the code it needs in its own build (see README.md).

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  buf:
    name: Lint and breaking changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # buf posts the results as a PR comment
    steps:
      - uses: actions/checkout@v4

      # On pull requests it also runs `buf breaking` against the base branch.
      # To merge an intentional breaking change, add the
      # "buf skip breaking" label to the PR.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          lint: true
          format: false
          push: false

  generator:
    name: Generate, compile and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the generator image from ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Generator version
        id: generator
        run: echo "version=$(tr -d '[:space:]' < SERIALIZERS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the protos with the generator image
        run: |
          docker run --rm -v "$PWD/proto:/in:ro" \
            ghcr.io/eagletrt/serializers:${{ steps.generator.outputs.version }} check
