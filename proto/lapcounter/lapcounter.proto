syntax = "proto3";

package PbLapCounter;

message Vector
{
	double x = 1;
	double y = 2;
}

message Line
{
	Vector position = 1;
	Vector direction = 2;
}

message Circuit
{
	string circuitId = 1;
	repeated Line checksLines = 2;
	repeated Line sectorsLines = 3;
}

enum Status { 
	DISARMED=0; 
	NO_INSTRUMENT=1; 
	NO_POSITION=2;
    NO_PROJECTION=3; 
	OFF_TRACK=4; 
	OUT_LAP=5; 
	TIMING=6; 
}

message LapCounterStatus {
  Status status = 1;
  uint32 dropped_laps = 2;
  string detail = 3;     
}