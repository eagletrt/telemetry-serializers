syntax = "proto3";

package Configs;

message Aero
{
    double angleOfIncidenceFront = 1;
    double angleOfIncidenceRear = 2;
    string flap = 3;
}

message Wheel
{
    double camber = 1;
    double toe = 2;
    string pressure = 3;
}

message Damper 
{
    double bound_low_comp = 1;
    double bound_high_comp = 2;
    double rebound = 3;
    double preload = 4;
}

message ImuCorrections 
{
    double x = 1;
    double y = 2;
    double z = 3;
}

enum TyrePosition {
    FL = 0;
    FR = 1;
    RL = 2;
    RR = 3;
}


message Tyre {
    string startDate = 1;
    string id = 2;
    TyrePosition position = 3;
    double kilometers = 4;
}

message Odometer {
    Tyre fl = 1;
    Tyre fr = 2;
    Tyre rl = 3;
    Tyre rr = 4;
}

message CarConfig
{
    Aero aero = 1;
    Wheel wheelFront = 2;
    Wheel wheelRear = 3;
    Damper damperFront = 4;
    Damper damperRear = 5;
    string wheelCompound = 6;
    double rideHeight = 7;
    string balancing = 8;
    string notes = 9;
    ImuCorrections imuCorrections = 10;
    Odometer odometer = 11;
}
