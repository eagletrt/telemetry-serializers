syntax = "proto3";

package InfluxLogger;

enum QueryFormat
{
    QUERY_FORMAT_CSV = 0;
}

enum QueryCompression
{
    QUERY_COMPRESSION_GZIP = 0;
    QUERY_COMPRESSION_NONE = 1;
}

enum QueryState
{
    QUERY_STATE_ACCEPTED  = 0;
    QUERY_STATE_RUNNING   = 1;
    QUERY_STATE_COMPLETED = 2;
    QUERY_STATE_FAILED    = 3;
}

enum QueryError
{
    QUERY_ERROR_NONE                 = 0;
    QUERY_ERROR_BAD_REQUEST          = 1;   // undecodable payload or missing fields
    QUERY_ERROR_INVALID_RANGE        = 2;   // start >= stop or interval beyond the limit
    QUERY_ERROR_NOT_AUTHORIZED       = 3;   // vehicle not in whitelist
    QUERY_ERROR_UNAVAILABLE          = 4;   // reader not active or shutting down
    QUERY_ERROR_DB_UNAVAILABLE       = 5;   // InfluxDB unreachable
    QUERY_ERROR_QUERY_FAILED         = 6;   // error returned by InfluxDB
    QUERY_ERROR_SERIALIZATION_FAILED = 7;   // error in CSV creation
    QUERY_ERROR_PUBLISH_FAILED       = 8;   // MQTT publish failed
    QUERY_ERROR_TIMEOUT              = 9;   // maximum execution time exceeded
    QUERY_ERROR_TOO_MUCH_DATA        = 10;  // maxRows or memory limit exceeded
    QUERY_ERROR_INTERNAL             = 11;  // unclassified exception
}

message QueryRequest
{
    uint64 start = 1;                  // start interval, epoch microseconds
    uint64 stop = 2;                   // end interval, epoch microseconds
    string transactionId = 3;          // redundant with topic, useful for logs and replay
    repeated string networks = 4;      // filter on networks, empty = all
    repeated string measurements = 5;  // filter on measurements, empty = all
    QueryFormat format = 6;
    QueryCompression compression = 7;
    uint64 maxRows = 8;                // 0 = default limit on logger side
    uint32 protocolVersion = 9;        // current version: 1
}

// Descriptor of a chunk published on
// {vehicleId}/{deviceId}/query/{transactionId}/data/content/{network}--{measurement}
// The payload (compressed CSV) remains the raw body of that topic: only metadata travels here.
message QueryChunkInfo
{
    string transactionId = 1;
    string network = 2;
    string measurement = 3;
    string topic = 4;         // topic on which the payload was published
    uint64 chunkNumber = 5;   // 1-based progressive in the transaction
    uint64 rows = 6;          // data rows, excluding the header
    uint64 sizeBytes = 7;     // size of the published payload
    string hash = 8;          // hexadecimal sha256 of the payload, for integrity verification
    QueryFormat format = 9;
    QueryCompression compression = 10;
}

// Status published on {vehicleId}/{deviceId}/query/{transactionId}/status with QoS 1.
// Replaces topics .../data/content/eof and .../data/content/error.
message QueryStatus
{
    string transactionId = 1;
    uint64 timestamp = 2;              // epoch microseconds
    QueryState state = 3;
    QueryError error = 4;              // QUERY_ERROR_NONE if not failed
    string stage = 5;                  // "request" | "query" | "serialization" | "publish"
    string description = 6;            // human-readable message, never used for application logic
    uint64 totalChunks = 7;            // set on COMPLETED
    uint64 totalRows = 8;              // set on COMPLETED
    uint32 protocolVersion = 9;        // current version: 1
    repeated QueryChunkInfo chunks = 10;  // manifest sent with COMPLETED, for verification
    map<string, string> details = 11;     // future diagnostic fields, without touching the schema
}
