# Buf configuration for the telemetry protobuf definitions.
# Docs: https://buf.build/docs/configuration/v2/buf-yaml
version: v2

modules:
  - path: proto

lint:
  use:
    - BASIC
  except:
    # The existing definitions use PascalCase packages (e.g. "Telemetry"),
    # camelCase field names and packages that do not match their directory.
    # Renaming them would change the generated code and the JSON field names
    # in every consumer, so these rules are disabled on purpose.
    # New fields use camelCase too (e.g. "lapTime", not "lap_time"): the Python
    # wrappers write JSON with the proto field names, the C++ ones convert them
    # to lowerCamelCase, so only camelCase names give the same JSON keys in both.
    - FIELD_LOWER_SNAKE_CASE
    - PACKAGE_LOWER_SNAKE_CASE
    - PACKAGE_DIRECTORY_MATCH
  # Known legacy violations: the rules stay active for every other file,
  # so new definitions must follow them.
  ignore_only:
    MESSAGE_PASCAL_CASE:
      - proto/can/can_error.proto
    ENUM_VALUE_UPPER_SNAKE_CASE:
      - proto/can/can_send.proto
      - proto/data/as_commands.proto
    ONEOF_LOWER_SNAKE_CASE:
      - proto/configs/forwarder_config.proto
      - proto/configs/telemetry_config.proto

breaking:
  # FILE is the strictest category: it also catches renames and moves that
  # would break the code generated by the consumers.
  use:
    - FILE
